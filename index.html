<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockholm events</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#595959; --line:#e2e2e2; --link:#0b57d0;
          --luma-bg:#dbe7ff; --luma-fg:#12306b; --meetup-bg:#fde0e0; --meetup-fg:#6b1212; --gametown-bg:#ffd54a; --gametown-fg:#3d2c00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --fg:#eee; --muted:#a8a8a8; --line:#333; --link:#8ab4f8;
            --luma-bg:#1d3a6e; --luma-fg:#d6e4ff; --meetup-bg:#5e1c1c; --meetup-fg:#ffd9d9; --gametown-bg:#7a5c00; --gametown-fg:#fff3c4; }
  }
  body { font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .meta { color:var(--muted); font-size:.85rem; margin-bottom:12px; }
  .filters label { margin-right:12px; }
  h2 { font-size:1rem; margin:24px 0 6px; padding-bottom:4px; border-bottom:1px solid var(--line); }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; gap:12px; padding:8px 0; align-items:flex-start; }
  .thumb { width:56px; height:56px; border-radius:8px; object-fit:cover; flex:none; background:var(--line); }
  .filters label { white-space:nowrap; }
  .filters button { margin-right:12px; font:inherit; font-size:.85rem; cursor:pointer; }
  .time { color:var(--muted); min-width:3.2rem; font-variant-numeric:tabular-nums; }
  a { color:var(--link); }
  .sub { color:var(--muted); font-size:.85rem; }
  .tag { font-size:.75rem; border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-left:4px; }
  .filters .group { margin-bottom:6px; }
  .filters .group strong { margin-right:8px; font-size:.85rem; }
  .filters .tag { margin-left:0; }
  .src-luma     { background:var(--luma-bg);     color:var(--luma-fg);     border-color:transparent; }
  .src-meetup   { background:var(--meetup-bg);   color:var(--meetup-fg);   border-color:transparent; }
  .src-gametown { background:var(--gametown-bg); color:var(--gametown-fg); border-color:transparent; font-weight:600; }
</style>
</head>
<body>
<h1>Stockholm events</h1>
<div class="meta" id="meta"></div>
<div class="filters" id="filters"></div>
<main id="list"></main>
<script>
const tz = "Europe/Stockholm";
const dayFmt = new Intl.DateTimeFormat("en-GB", { timeZone: tz, weekday: "long", day: "numeric", month: "long" });
const keyFmt = new Intl.DateTimeFormat("en-CA", { timeZone: tz });
const timeFmt = new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit" });
const el = (tag, text, cls) => { const n = document.createElement(tag); if (text) n.textContent = text; if (cls) n.className = cls; return n; };

fetch("events.json").then(r => r.json()).then(({ updated, events }) => {
  document.getElementById("meta").textContent =
    events.length + " events, updated " + new Date(updated).toLocaleString("en-GB", { timeZone: tz });

  // One checkbox group (with a select/unselect-all button) per filter; returns the set of ticked values.
  const filters = document.getElementById("filters");
  function filterGroup(title, values, tagClass) {
    const on = new Set(values), boxes = [];
    const row = el("div", null, "group");
    const toggle = el("button", "Unselect all");
    toggle.type = "button";
    const sync = () => { toggle.textContent = on.size === values.length ? "Unselect all" : "Select all"; };
    toggle.onclick = () => {
      const all = on.size !== values.length;
      for (const b of boxes) b.checked = all;
      on.clear();
      if (all) values.forEach(v => on.add(v));
      sync(); render();
    };
    row.append(el("strong", title), toggle);
    for (const v of values) {
      const label = el("label"), box = el("input");
      box.type = "checkbox"; box.checked = true;
      box.onchange = () => { box.checked ? on.add(v) : on.delete(v); sync(); render(); };
      boxes.push(box);
      label.append(box, " ", tagClass ? el("span", v, "tag " + tagClass(v)) : document.createTextNode(v));
      row.append(label);
    }
    filters.append(row);
    return on;
  }
  const srcClass = s => "src-" + s;
  const onSource = filterGroup("Source", [...new Set(events.flatMap(e => e.sources))], srcClass);
  const onCat = filterGroup("Category", [...new Set(events.flatMap(e => e.categories))]);

  function render() {
    const list = document.getElementById("list");
    list.replaceChildren();
    const now = Date.now();
    let ul, lastDay;
    for (const e of events) {
      if (!e.categories.some(c => onCat.has(c)) || !e.sources.some(s => onSource.has(s)) || Date.parse(e.end || e.start) < now) continue;
      const d = new Date(e.start), day = keyFmt.format(d);
      if (day !== lastDay) {
        lastDay = day;
        list.append(el("h2", dayFmt.format(d)));
        ul = el("ul"); list.append(ul);
      }
      const li = el("li"), body = el("div");
      const a = el("a", e.name); a.href = e.url;
      const title = el("div"); title.append(a);
      for (const c of e.categories) title.append(el("span", c, "tag"));
      for (const s of e.sources) title.append(el("span", s, "tag " + srcClass(s)));
      const sub = [e.online ? "Online" : e.place, e.hosts.join(", ")].filter(Boolean).join(" · ");
      body.append(title, el("div", sub, "sub"));
      const img = el("img", null, "thumb");
      img.loading = "lazy"; img.alt = "";
      if (e.cover) img.src = e.cover.replace("://images.lumacdn.com/", "://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,width=112,height=112,quality=75/");
      else img.style.visibility = "hidden";
      li.append(img, el("span", e.allDay ? "all day" : timeFmt.format(d), "time"), body);
      ul.append(li);
    }
    if (!ul) list.append(el("p", "Nothing upcoming.", "sub"));
  }
  render();
}).catch(err => { document.getElementById("meta").textContent = "Could not load events.json: " + err; });
</script>
</body>
</html>
